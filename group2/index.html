<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binärbollwerk – Stufe 2</title>
    <link rel="stylesheet" href="../assets/styles.css">
</head>

<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="game-config" data-target="42" data-letter="u"></div>

    <div class="container" id="main-container">
        <div class="status-bar">
            <span>System</span>
            <span>Security</span>
            <span>v2.0</span>
        </div>

        <h1>Binärbollwerk – Stufe 2</h1>

        <div class="display-box">
            <span class="display-label">Required Decimal Code</span>
            <div class="target-number" id="display-number">...</div>
        </div>

        <div class="door-container">
            <div class="door-panel door-left"></div>
            <div class="door-panel door-right"></div>
            <div class="lock-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2C9.243 2 7 4.243 7 7V10H6C4.897 10 4 10.897 4 12V20C4 21.103 4.897 22 6 22H18C19.103 22 20 21.103 20 20V12C20 10.897 19.103 10 18 10H17V7C17 4.243 14.757 2 12 2ZM12 4C13.654 4 15 5.346 15 7V10H9V7C9 5.346 10.346 4 12 4ZM12 17C10.897 17 10 16.103 10 15C10 13.897 10.897 13 12 13C13.103 13 14 13.897 14 15C14 16.103 13.103 17 12 17Z" />
                </svg>
            </div>
            <div class="secret-content" id="secret-letter">u</div>
        </div>

        <div class="switch-board">
            <div class="switch-unit"><input type="checkbox" id="bit-7" class="switch-input" value="128"><label
                    for="bit-7" class="switch-label"></label></div>
            <div class="switch-unit"><input type="checkbox" id="bit-6" class="switch-input" value="64"><label
                    for="bit-6" class="switch-label"></label></div>
            <div class="switch-unit"><input type="checkbox" id="bit-5" class="switch-input" value="32"><label
                    for="bit-5" class="switch-label"></label></div>
            <div class="switch-unit"><input type="checkbox" id="bit-4" class="switch-input" value="16"><label
                    for="bit-4" class="switch-label"></label></div>
            <div class="switch-unit"><input type="checkbox" id="bit-3" class="switch-input" value="8"><label for="bit-3"
                    class="switch-label"></label></div>
            <div class="switch-unit"><input type="checkbox" id="bit-2" class="switch-input" value="4"><label for="bit-2"
                    class="switch-label"></label></div>
            <div class="switch-unit"><input type="checkbox" id="bit-1" class="switch-input" value="2"><label for="bit-1"
                    class="switch-label"></label></div>
            <div class="switch-unit"><input type="checkbox" id="bit-0" class="switch-input" value="1"><label for="bit-0"
                    class="switch-label"></label></div>
        </div>

        <button id="execute-btn" class="execute-btn">EXECUTE</button>
    </div>

    <script src="../assets/game.js"></script>
</body>

</html>
